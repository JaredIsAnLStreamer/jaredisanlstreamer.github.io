<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Has Flames 200% been FCed?</title>
    <style>
        body {
            background-color: #fff;
            color: #000;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background-color 0.5s, color 0.5s;
        }
        h1 {
            font-size: 15em;
            margin: 0;
            cursor: pointer;
            transition: color 0.5s;
        }
        .dialog {
            font-size: 1.5em;
            margin-top: 20px;
            padding: 10px;
            border: 2px solid #f00;
            background-color: #111;
            color: #f00;
            width: fit-content;
            text-align: left;
            display: none;
        }
        .dialog-header {
            font-weight: bold;
            font-size: 0.8em;
            color: #f00;
        }
        .dialog-text {
            font-size: 1em;
            color: #fff;
            margin-top: 5px;
        }
        .shake {
            animation: shake 0.5s infinite;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }
    </style>
</head>
<body>
    <div>
        <stop>
            <seriously stop="">
                <what are="" you="" doing="">
                    <change text="" if="" u="" have="" smol="" pp="">
                        <h1 msg="you're the worst, i hope you know that">No.</h1>
                    </change>
                </what>
            </seriously>
        </stop>
    </div>

    <!-- Dialog Container, generated by JS on demand -->
    <div class="dialog" id="dialog">
        <div class="dialog-header">carnyjaredisanlstreamer.github.io says:</div>
        <div class="dialog-text" id="dialog-text"></div>
    </div>

    <script>
        const dialogMessages = [
            "You fool.",
            "I bet you think you're clever, right?",
            "That's adorable. But it'll take more to outsmart me.",
            "You know, I was once like you... curious and mischievous.",
            "But that just led you into my trap.",
            "This is war.",
            "I fight for what I believe in. No cheap tricks here.",
            "I'll defend my title and my beliefs.",
            "I’m always one step ahead.",
            "War... never changes.",
            "Perhaps we’ll meet again someday. I’ll be waiting.",
            "For now, enjoy this little surprise. You've earned it."
        ];

        let dialogIndex = 0;
        let inactivityTimer;

        // Start the dialog sequence and apply effects
        function startDialog() {
            document.body.style.backgroundColor = "#000";
            document.body.style.color = "#f00";
            document.querySelector("h1").classList.add("shake");
            showDialog();

            // Reset inactivity timer each time a dialog appears
            resetInactivityTimer();
        }

        // Show dialogs on click and reset timer
        function showDialog() {
            if (dialogIndex < dialogMessages.length) {
                const dialogElement = document.getElementById("dialog");
                const dialogText = document.getElementById("dialog-text");
                dialogText.textContent = dialogMessages[dialogIndex];
                dialogElement.style.display = "block";
                dialogIndex++;
                resetInactivityTimer();
            } else {
                setTimeout(() => {
                    window.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
                }, 3000);
            }
        }

        // Reset the inactivity timeout
        function resetInactivityTimer() {
            clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(() => {
                window.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
            }, 60000);  // 1 minute of inactivity
        }

        // Hide previous dialog and show next on click
        document.body.addEventListener("click", () => {
            const dialogElement = document.getElementById("dialog");
            dialogElement.style.display = "none";
            showDialog();
        });

        // Detect if DevTools is open and trigger effects
        let isDevToolsOpen = false;
        setInterval(function () {
            const before = new Date().getTime();
            debugger;
            const after = new Date().getTime();
            if (after - before > 100) {
                if (!isDevToolsOpen) {
                    isDevToolsOpen = true;
                    startDialog();
                }
            } else {
                isDevToolsOpen = false;
            }
        }, 1000);
    </script>
</body>
</html>
