<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Clone Hero Customs List</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

 body::before{
  content:"";
  position: fixed;
  inset: 0;
  z-index: -2;

  background: url("bg.jpg") center/cover no-repeat;
  filter: blur(12px);
  transform: scale(1.08);
}

body::after{
  content:"";
  position: fixed;
  inset: 0;
  z-index: -1;

  background: rgba(0,0,0,.65);
}
 
body {
  font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: transparent;
  color: #eaeaea;
  min-height: 100vh;
  position: relative;
}

  a { color: inherit; text-decoration: none; }

  .topbar {
    height: 56px;
    background: rgba(20,20,20,.85);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 1rem;
    box-shadow: 0 2px 10px rgba(0,0,0,.4);
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .left {
    display: flex;
    align-items: center;
    gap: .8rem;
  }

  .burger { font-size: 1.3rem; cursor: pointer; opacity: .85; }
  .logo { font-weight: 700; font-size: 1.1rem; letter-spacing: .2px; }

  .top-search {
    width: min(520px, 50vw);
    padding: .55rem .95rem;
    border-radius: 999px;
    border: none;
    background: rgba(42,42,42,.95);
    color: #eaeaea;
    font-size: .9rem;
    font-family: inherit;
    outline: none;
  }
  .top-search::placeholder { color: #9a9a9a; }
  .top-search:focus { box-shadow: 0 0 0 2px rgba(100,140,255,.35); }

  main { padding: 1.2rem; }

  /* GRID LIST */
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 1.2rem;
  }

  .card {
    background: rgba(18,18,18,.95);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
    transition: transform .15s ease, box-shadow .15s ease;
    cursor: pointer;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 40px rgba(0,0,0,.55);
  }

  .thumb {
    height: 180px;
    background-size: cover;
    background-position: center;
    position: relative;
  }

  .info {
    padding: .8rem .9rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .8rem;
  }

  .left-info {
    display: flex;
    align-items: center;
    gap: .8rem;
    min-width: 0;
  }

  .rank {
    font-size: 2.1rem;
    font-weight: 900;
    color: rgba(255,255,255,.22);
    min-width: 56px;
    text-align: right;
    line-height: 1;
    text-shadow: 0 10px 30px rgba(0,0,0,.35);
  }

  .text { min-width: 0; flex: 1; }
  .title {
    font-weight: 650;
    font-size: .95rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .meta { font-size: .75rem; color: #bdbdbd; }
  .points { font-size: .75rem; color: #d7d7d7; margin-top: 2px; }

  .badge {
    font-size: .7rem;
    font-weight: 900;
    padding: .35rem .6rem;
    border-radius: 8px;
    text-transform: uppercase;
    flex-shrink: 0;
    letter-spacing: .4px;
  }
  .fc { background: linear-gradient(135deg,#44ff99,#1db954); color:#000; }
  .pass { background: linear-gradient(135deg,#4aa3ff,#3b6cff); color:#000; }

  /* DETAIL PAGE */
  #detailPage { display: none; }

  .detail-wrap {
    max-width: 1180px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1.25fr .75fr;
    gap: 1.2rem;
    align-items: start;
  }

  .hero {
    border-radius: 26px;
    overflow: hidden;
    background: rgba(15,15,15,.95);
    box-shadow: 0 16px 50px rgba(0,0,0,.55);
  }

  .hero-banner {
    height: 320px;
    background-size: cover;
    background-position: center;
    position: relative;
  }

  .hero-banner::after{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(to top, rgba(0,0,0,.72), rgba(0,0,0,0));
  }

  .hero-info {
    padding: 1.05rem 1.2rem 1.2rem;
    display:flex;
    gap: 1rem;
    align-items: center;
    justify-content: space-between;
  }

  .hero-left {
    display:flex;
    align-items:center;
    gap: 1rem;
    min-width: 0;
  }

  .hero-rank {
    font-size: 3rem;
    font-weight: 1000;
    color: rgba(255,255,255,.25);
    min-width: 90px;
    text-align: right;
    line-height: 1;
  }

  .hero-title {
    font-size: 1.25rem;
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 700px;
  }

  .hero-sub {
    font-size: .85rem;
    color: rgba(255,255,255,.72);
    margin-top: 4px;
  }

  .hero-right { display:flex; flex-direction: column; align-items:flex-end; gap:.5rem; }
  .hero-total {
    font-weight: 800;
    color: rgba(255,255,255,.9);
    font-size: .95rem;
  }

  .pill {
    font-size: .75rem;
    font-weight: 900;
    padding: .4rem .75rem;
    border-radius: 999px;
    letter-spacing: .4px;
    text-transform: uppercase;
  }

  .panel {
    border-radius: 26px;
    background: rgba(18,18,18,.95);
    box-shadow: 0 16px 50px rgba(0,0,0,.55);
    padding: 1.1rem 1.1rem;
  }

  .panel h3 {
    font-size: .95rem;
    font-weight: 900;
    margin-bottom: .75rem;
    opacity: .95;
  }

  .kv {
    display:flex;
    justify-content: space-between;
    gap: 1rem;
    padding: .45rem 0;
    border-bottom: 1px solid rgba(255,255,255,.08);
    font-size: .9rem;
  }
  .kv:last-child { border-bottom: none; }
  .kv .k { color: rgba(255,255,255,.65); }
  .kv .v { font-weight: 800; color: rgba(255,255,255,.92); }

  .btn {
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap: .5rem;
    padding: .65rem .9rem;
    border-radius: 14px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
    font-weight: 850;
    cursor:pointer;
    transition: transform .12s ease, background .12s ease;
    user-select:none;
  }
  .btn:hover { transform: translateY(-2px); background: rgba(255,255,255,.12); }
  .btn:active { transform: translateY(0px); }

  .btn-primary {
    background: linear-gradient(135deg, rgba(85,140,255,.95), rgba(120,85,255,.95));
    border: none;
    color: #fff;
  }

  .embed {
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 22px;
    overflow:hidden;
    box-shadow: 0 16px 50px rgba(0,0,0,.45);
    background: #000;
  }
  iframe { width:100%; height:100%; border:0; display:block; }

  .top-actions {
    display:flex;
    gap:.7rem;
    align-items:center;
  }

  .muted { opacity: .7; }

  @media (max-width: 980px){
    .detail-wrap { grid-template-columns: 1fr; }
    .hero-title { max-width: 65vw; }
  }
</style>
</head>

<body>

<div class="topbar">
  <div class="left">
    <div class="burger">☰</div>
    <div class="logo">Clone Hero Customs</div>
  </div>

  <div class="top-actions">
    <input class="top-search" placeholder="Search songs / artists" />
    <div id="backBtn" class="btn" style="display:none;">← Back</div>
  </div>
</div>

<main>
  <!-- LIST VIEW -->
  <div id="listPage">
    <div id="grid"></div>
  </div>

  <!-- DETAIL VIEW -->
  <div id="detailPage">
    <div class="detail-wrap">
      <div>
        <div class="hero">
          <div id="heroBanner" class="hero-banner"></div>
          <div class="hero-info">
            <div class="hero-left">
              <div id="heroRank" class="hero-rank">#?</div>
              <div style="min-width:0;">
                <div id="heroTitle" class="hero-title">Song Title</div>
                <div id="heroSub" class="hero-sub muted">Artist • Charter</div>
              </div>
            </div>
            <div class="hero-right">
              <div id="heroType" class="pill fc">FC</div>
              <div id="heroTotal" class="hero-total">0 pts</div>
            </div>
          </div>
        </div>

        <div style="height:1.1rem;"></div>

        <div class="embed">
          <iframe id="ytEmbed" allowfullscreen
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"></iframe>
        </div>
      </div>

      <div class="panel">
        <h3>Stats</h3>

        <div class="kv"><div class="k">Title</div><div id="sTitle" class="v">—</div></div>
        <div class="kv"><div class="k">Artist</div><div id="sArtist" class="v">—</div></div>
        <div class="kv"><div class="k">Charter</div><div id="sCharter" class="v">—</div></div>
        <div class="kv"><div class="k">Type</div><div id="sType" class="v">—</div></div>
        <div class="kv"><div class="k">Total Points</div><div id="sTotal" class="v">—</div></div>

        <div style="height: .9rem;"></div>

        <a id="chartBtn" class="btn btn-primary" href="#" target="_blank" rel="noopener">
          ⬇ Chart Download
        </a>

        <div style="height: 1.1rem;"></div>

        <h3>Point Breakdown</h3>
        <div id="breakdown"></div>
      </div>
    </div>
  </div>
</main>

<script>
let entries = [];
const grid = document.getElementById("grid");
const search = document.querySelector(".top-search");

const listPage = document.getElementById("listPage");
const detailPage = document.getElementById("detailPage");
const backBtn = document.getElementById("backBtn");

/* ---------- URL helpers ---------- */
function setQuery(params) {
  const url = new URL(location.href);
  Object.entries(params).forEach(([k,v]) => {
    if (v === null || v === undefined || v === "") url.searchParams.delete(k);
    else url.searchParams.set(k, v);
  });
  history.pushState({}, "", url);
}

function getQuery(key){
  return new URL(location.href).searchParams.get(key);
}

/* ---------- load data ---------- */
async function loadCustoms() {
  const files = await fetch("customs/index.json").then(r => r.json());

  const loaded = await Promise.all(
    files.map(f => fetch("customs/" + f).then(r => r.json()))
  );

  entries = loaded.flatMap(file =>
    file.songs.map(song => {
      const totalPoints = Object.values(song.points || {})
        .reduce((a, b) => a + b, 0);

      return {
        ...song,
        totalPoints,
        status: file.type
      };
    })
  );

  route();
}

/* ---------- ranking ---------- */
function getSortedList(list){
  return [...list].sort((a, b) => b.totalPoints - a.totalPoints);
}

function getRankForSong(song){
  const sorted = getSortedList(entries);
  // match by youtubeId + title (safer than title only)
  const idx = sorted.findIndex(s => (s.youtubeId === song.youtubeId) && (s.title === song.title));
  return idx >= 0 ? idx + 1 : null;
}

/* ---------- list render ---------- */
function renderList(list) {
  grid.innerHTML = "";
  const sorted = getSortedList(list);

  sorted.forEach((e, i) => {
    const thumb = `https://img.youtube.com/vi/${e.youtubeId}/hqdefault.jpg`;
    const rank = i + 1;

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="thumb" style="background-image:url('${thumb}')"></div>
      <div class="info">
        <div class="left-info">
          <div class="rank">#${rank}</div>
          <div class="text">
            <div class="title">${escapeHtml(e.title)}</div>
            <div class="meta">${escapeHtml(e.artist)}</div>
            <div class="points">${e.totalPoints} pts</div>
          </div>
        </div>
        <div class="badge ${e.status}">${e.status}</div>
      </div>
    `;

    card.addEventListener("click", () => {
      // "takes you to another page" (same file, different view)
      setQuery({
        song: e.title,
        yt: e.youtubeId
      });
      showDetail(e);
    });

    grid.appendChild(card);
  });
}

/* ---------- detail render ---------- */
function showDetail(song){
  listPage.style.display = "none";
  detailPage.style.display = "block";
  backBtn.style.display = "inline-flex";
  search.style.display = "none";

  const rank = getRankForSong(song);
  const thumb = `https://img.youtube.com/vi/${song.youtubeId}/maxresdefault.jpg`;
  const thumbFallback = `https://img.youtube.com/vi/${song.youtubeId}/hqdefault.jpg`;

  const banner = document.getElementById("heroBanner");
  banner.style.backgroundImage = `url('${thumb}')`;
  // fallback if maxres doesn't exist
  const testImg = new Image();
  testImg.onload = () => {};
  testImg.onerror = () => banner.style.backgroundImage = `url('${thumbFallback}')`;
  testImg.src = thumb;

  document.getElementById("heroRank").textContent = rank ? `#${rank}` : "#?";
  document.getElementById("heroTitle").textContent = song.title;
  document.getElementById("heroSub").textContent = `${song.artist} • ${song.charter || "Unknown charter"}`;

  const typePill = document.getElementById("heroType");
  typePill.textContent = song.status.toUpperCase();
  typePill.className = "pill " + (song.status === "fc" ? "fc" : "pass");

  document.getElementById("heroTotal").textContent = `${song.totalPoints} pts`;

  // stats panel
  document.getElementById("sTitle").textContent = song.title;
  document.getElementById("sArtist").textContent = song.artist;
  document.getElementById("sCharter").textContent = song.charter || "Unknown";
  document.getElementById("sType").textContent = song.status.toUpperCase();
  document.getElementById("sTotal").textContent = `${song.totalPoints} pts`;

  // chart download
  const chartBtn = document.getElementById("chartBtn");
  chartBtn.href = song.chartDownload || "#";
  chartBtn.style.opacity = song.chartDownload ? "1" : ".45";
  chartBtn.style.pointerEvents = song.chartDownload ? "auto" : "none";

  // youtube embed (first completion video)
  document.getElementById("ytEmbed").src =
    `https://www.youtube-nocookie.com/embed/${encodeURIComponent(song.youtubeId)}?rel=0`;

  // point breakdown
  const breakdown = document.getElementById("breakdown");
  breakdown.innerHTML = "";
  const points = song.points || {};
  Object.entries(points).forEach(([k,v]) => {
    const row = document.createElement("div");
    row.className = "kv";
    row.innerHTML = `<div class="k">${escapeHtml(k)}</div><div class="v">${Number(v) || 0}</div>`;
    breakdown.appendChild(row);
  });
}

function showList(){
  detailPage.style.display = "none";
  listPage.style.display = "block";
  backBtn.style.display = "none";
  search.style.display = "block";

  setQuery({ song: null, yt: null });

  // rerender list using current search
  const q = search.value.toLowerCase().trim();
  if(!q) renderList(entries);
  else renderList(entries.filter(e =>
    e.title.toLowerCase().includes(q) ||
    e.artist.toLowerCase().includes(q)
  ));
}

/* ---------- routing ---------- */
function route(){
  const songTitle = getQuery("song");
  const yt = getQuery("yt");

  if(songTitle && yt){
    const found = entries.find(e => e.youtubeId === yt && e.title === songTitle);
    if(found) showDetail(found);
    else showList();
  } else {
    showList();
  }
}

/* ---------- search ---------- */
search.addEventListener("input", () => {
  const q = search.value.toLowerCase().trim();
  renderList(entries.filter(e =>
    e.title.toLowerCase().includes(q) ||
    e.artist.toLowerCase().includes(q)
  ));
});

/* ---------- back ---------- */
backBtn.addEventListener("click", showList);
window.addEventListener("popstate", route);

/* ---------- util ---------- */
function escapeHtml(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

loadCustoms();
</script>

</body>
</html>
