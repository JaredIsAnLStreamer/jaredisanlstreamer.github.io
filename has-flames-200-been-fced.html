<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Has Flames 200% been FCed?</title>
    <style>
        body {
            background-color: #fff;
            color: #000;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            font-size: 15em;
            margin: 0;
            cursor: pointer;
        }
        .dialog {
            font-size: 1.5em;
            margin-top: 20px;
            padding: 10px;
            border: 2px solid #f00;
            background-color: #111;
            color: #f00;
            width: fit-content;
            text-align: left;
            display: none;
        }
        .dialog-header {
            font-weight: bold;
            font-size: 0.8em;
            color: #f00;
        }
        .dialog-text {
            font-size: 1em;
            color: #fff;
            margin-top: 5px;
        }
        .shake {
            animation: shake 0.15s infinite;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
        }
    </style>
</head>
<body>
    <div>
        <stop>
            <seriously stop="">
                <what are="" you="" doing="">
                    <change text="" if="" u="" have="" smol="" pp="">
                        <h1 msg="you're the worst, i hope you know that">No.</h1>
                    </change>
                </what>
            </seriously>
        </stop>
    </div>

    <!-- Dialog Container, generated by JS on demand -->
    <div class="dialog" id="dialog">
        <div class="dialog-header">carnyjaredisanlstreamer.github.io says:</div>
        <div class="dialog-text" id="dialog-text"></div>
    </div>

    <script>
        const dialogMessages = [
            "You fool. Thinking you could just figure it all out.",
            "I bet you think you're clever, right?",
            "That's adorable. But it'll take more to beat me.",
            "You know, I was once like you... curious, maybe a little mischievous.",
            "But that just led you deeper into my trap, didn't it?",
            "This is war. And I'm not one to lose.",
            "I fight for what I believe in. No cheap tricks here.",
            "I'll defend my title. You won’t see me falter.",
            "I’m always one step ahead. Every. Single. Time.",
            "War... it never changes, does it?",
            "Perhaps we’ll meet again someday. I’ll be waiting.",
            "For now, enjoy this little surprise. You've earned it."
        ];

        let dialogIndex = 0;
        let inactivityTimer;
        let effectTriggered = false;
        const h1Element = document.querySelector("h1");
        const originalText = h1Element.textContent;

        // Detect if h1 text is changed manually via inspect element
        const observer = new MutationObserver(() => {
            if (h1Element.textContent !== originalText && !effectTriggered) {
                effectTriggered = true;
                startDialog();
            }
        });
        observer.observe(h1Element, { characterData: true, childList: true, subtree: true });

        // Start dialog sequence and apply effects
        function startDialog() {
            document.body.style.backgroundColor = "#000";
            document.body.style.color = "#f00";
            h1Element.classList.add("shake");
            showDialog();
            resetInactivityTimer();
        }

        // Show dialog on click and reset timer
        function showDialog() {
            if (dialogIndex < dialogMessages.length) {
                const dialogElement = document.getElementById("dialog");
                const dialogText = document.getElementById("dialog-text");
                dialogText.textContent = dialogMessages[dialogIndex];
                dialogElement.style.display = "block";
                dialogIndex++;
                resetInactivityTimer();
            } else {
                setTimeout(() => {
                    window.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
                }, 3000);
            }
        }

        // Reset inactivity timeout
        function resetInactivityTimer() {
            clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(() => {
                window.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
            }, 60000);
        }

        // Hide previous dialog and show next on click
        document.body.addEventListener("click", () => {
            if (effectTriggered) {
                const dialogElement = document.getElementById("dialog");
                dialogElement.style.display = "none";
                showDialog();
            }
        });
    </script>
</body>
</html>
